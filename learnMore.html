<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn More — Tilted Tips</title>
<style>
  :root {
    --pink-bg: #fdf1f7;
    --pink-accent: #d6127a;
    --text-dark: #2b2b2b;
    --text-muted: #6b6b6b;
    --button-bg: #f2e2e6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  header {
    width: 100%;
    background: var(--pink-bg);
  }

  header img {
    width: 100%;
    display: block;
    max-width: 1600px;
    margin: 0 auto;
  }

  .back-link {
    display: block;
    max-width: 700px;
    margin: 20px auto 0;
    padding: 0 20px;
    font-size: 0.9rem;
  }

  .back-link a {
    color: var(--pink-accent);
    text-decoration: none;
  }

  .back-link a:hover {
    text-decoration: underline;
  }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 20px 20px;
    text-align: center;
  }

  h1 {
    color: var(--pink-accent);
    font-size: 2rem;
    margin: 0 0 24px;
  }

  .intro {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--text-dark);
    margin: 0 0 60px;
  }

  h2 {
    color: var(--pink-accent);
    font-size: 1.4rem;
    margin: 0 0 24px;
  }

  .social-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 70px;
  }

  .social-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--button-bg);
    border: 1px solid #d8c3c8;
    color: var(--pink-accent);
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .social-icon svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }

  .social-icon:hover {
    background: var(--pink-accent);
    color: #ffffff;
    transform: translateY(-2px);
  }

  footer {
    text-align: center;
    padding: 30px 20px 50px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  footer a {
    color: var(--pink-accent);
    text-decoration: none;
  }
</style>
</head>
